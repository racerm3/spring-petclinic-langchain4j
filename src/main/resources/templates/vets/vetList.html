<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2>Veterinarians</h2>

  <form th:action="@{/vets.html}" method="get" class="form-horizontal" id="search-vet-form">
    <div class="form-group">
      <div class="control-group" id="lastNameGroup">
        <label class="col-sm-2 control-label">Last name </label>
        <div class="col-sm-4">
          <input class="form-control" name="lastName" th:value="${lastName}" size="30" maxlength="80" />
        </div>
      </div>
      <div class="control-group" id="specialtyGroup">
        <label class="col-sm-2 control-label">Specialty </label>
        <div class="col-sm-4">
          <select name="specialtyId" class="form-control">
            <option value="">All</option>
            <option th:each="specialty : ${specialties}" th:value="${specialty.id}" th:text="${specialty.name}"
              th:selected="${specialty.id == specialtyId}">
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </div>
  </form>

  <br />

  <table id="vets" class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Specialties</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="vet : ${listVets}">
        <td>
          <a th:href="@{/vets/{vetId}/edit(vetId=${vet.id})}" th:text="${vet.firstName + ' ' + vet.lastName}"></a>
        </td>
        <td><span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}">none</span></td>
      </tr>
    </tbody>
  </table>

  <div th:if="${totalPages > 1}">
    <span>Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}"
        th:href="@{/vets.html(page=${i}, lastName=${lastName}, specialtyId=${specialtyId})}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=1, lastName=${lastName}, specialtyId=${specialtyId})}"
        title="First" class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" title="First" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}"
        th:href="@{/vets.html(page=${currentPage - 1}, lastName=${lastName}, specialtyId=${specialtyId})}"
        title="Previous" class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" title="Previous" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}"
        th:href="@{/vets.html(page=${currentPage + 1}, lastName=${lastName}, specialtyId=${specialtyId})}" title="Next"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" title="Next" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}"
        th:href="@{/vets.html(page=${totalPages}, lastName=${lastName}, specialtyId=${specialtyId})}" title="Last"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" title="Last" class="fa fa-fast-forward"></span>
    </span>
  </div>

  <br />
  <a class="btn btn-primary" th:href="@{/vets/new}">Add Veterinarian</a>

</body>

</html>
