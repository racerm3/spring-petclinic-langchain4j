<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <div class="page-header">
    <h1>Veterinarians</h1>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <form th:action="@{/vets.html}" method="get" id="search-vet-form">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="lastName" class="form-label">Last name</label>
            <input id="lastName" class="form-control" name="lastName" th:value="${lastName}" size="30" maxlength="80" placeholder="Filter by name"/>
          </div>
          <div class="col-md-4">
            <label for="specialtyId" class="form-label">Specialty</label>
            <select id="specialtyId" name="specialtyId" class="form-select">
              <option value="">All</option>
              <option th:each="specialty : ${specialties}" th:value="${specialty.id}" th:text="${specialty.name}"
                th:selected="${specialty.id == specialtyId}"></option>
            </select>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table id="vets" class="table table-striped table-hover mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Specialties</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="vet : ${listVets}">
              <td>
                <a th:href="@{/vets/{vetId}/edit(vetId=${vet.id})}" th:text="${vet.firstName + ' ' + vet.lastName}"></a>
              </td>
              <td>
                <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}"></span>
                <span th:if="${vet.nrOfSpecialties == 0}">none</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${totalPages > 1}" class="pagination-links p-3 border-top">
        <span class="me-2">Pages:</span>
        <span class="me-1">[</span>
        <span th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:if="${currentPage != i}" th:href="@{/vets.html(page=${i}, lastName=${lastName}, specialtyId=${specialtyId})}" class="me-1">[[${i}]]</a>
          <span th:unless="${currentPage != i}" class="me-1 fw-bold">[[${i}]]</span>
        </span>
        <span class="me-2">]</span>
        <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=1, lastName=${lastName}, specialtyId=${specialtyId})}" title="First" class="fa fa-fast-backward me-2"></a>
        <span th:unless="${currentPage > 1}" class="fa fa-fast-backward me-2 text-secondary"></span>
        <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=${currentPage - 1}, lastName=${lastName}, specialtyId=${specialtyId})}" title="Previous" class="fa fa-step-backward me-2"></a>
        <span th:unless="${currentPage > 1}" class="fa fa-step-backward me-2 text-secondary"></span>
        <a th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${currentPage + 1}, lastName=${lastName}, specialtyId=${specialtyId})}" title="Next" class="fa fa-step-forward me-2"></a>
        <span th:unless="${currentPage < totalPages}" class="fa fa-step-forward me-2 text-secondary"></span>
        <a th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${totalPages}, lastName=${lastName}, specialtyId=${specialtyId})}" title="Last" class="fa fa-fast-forward"></a>
        <span th:unless="${currentPage < totalPages}" class="fa fa-fast-forward text-secondary"></span>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a class="btn btn-primary" th:href="@{/vets/new}">Add Veterinarian</a>
  </div>

</body>

</html>
