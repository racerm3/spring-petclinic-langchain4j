<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'error')}">

  <body>
    <div class="error-page">
      <img src="../static/resources/images/pets.png" th:src="@{/resources/images/pets.png}" alt="" class="img-fluid mb-3" style="max-width: 200px;"/>
      <h2 class="error-title">Something happened...</h2>
      <p class="mb-4" th:text="${message}">Exception message</p>
      <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
    </div>
  </body>

</html>
