<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2>Register</h2>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/register}" th:object="${user}" method="post" class="form-horizontal">
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">First Name</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{firstName}" class="form-control" required/>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Last Name</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{lastName}" class="form-control" required/>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Username</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{username}" class="form-control" required minlength="1"/>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Password</label>
      <div class="col-sm-10">
        <input type="password" th:field="*{password}" class="form-control" required minlength="8"/>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit">Register</button>
      </div>
    </div>
  </form>
  
  <p><br/><a th:href="@{/login}">Back to Login</a></p>

</body>
</html>
