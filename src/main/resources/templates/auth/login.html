<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'login')}">

<body>

  <h2>Login</h2>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in!</div>
  <div th:if="${param.passwordChanged}" class="alert alert-success">Password changed. Please log in!</div>

  <form th:action="@{/login}" method="post" class="form-horizontal">
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Username</label>
      <div class="col-sm-10">
        <input type="text" name="username" class="form-control" required/>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Password</label>
      <div class="col-sm-10">
        <input type="password" name="password" class="form-control" required/>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit">Log in</button>
      </div>
    </div>
  </form>
  
  <p><br/><a th:href="@{/register}">Register here</a></p>
  <p><a th:href="@{/forgot-password}">Forgot Password?</a></p>

</body>
</html>
