<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2>Forgot Password</h2>
  <p>Supply your existing username to set a new password.</p>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/forgot-password}" method="post" class="form-horizontal">
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Username</label>
      <div class="col-sm-10">
        <input type="text" name="username" class="form-control" required/>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">New Password</label>
      <div class="col-sm-10">
        <input type="password" name="newPassword" class="form-control" required minlength="8"/>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit">Change Password</button>
      </div>
    </div>
  </form>
  
  <p><br/><a th:href="@{/login}">Back to Login</a></p>

</body>
</html>
