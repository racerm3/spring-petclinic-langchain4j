<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'pets')}">

<body>

  <div class="page-header">
    <h1>Pets</h1>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table id="pets" class="table table-striped table-hover mb-0">
          <thead>
            <tr>
              <th style="width: 150px;">Name</th>
              <th style="width: 150px;">Birth Date</th>
              <th style="width: 150px;">Type</th>
              <th>Owner</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="pet : ${listPets}">
              <td>
                <a th:href="@{/owners/__${pet.owner?.id}__}" th:text="${pet.name}"></a>
              </td>
              <td th:text="${pet.birthDate}"></td>
              <td th:text="${pet.type?.name}"></td>
              <td>
                <a th:if="${pet.owner != null}" th:href="@{/owners/__${pet.owner.id}__}"
                  th:text="${pet.owner.firstName + ' ' + pet.owner.lastName}"></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${totalPages > 1}" class="pagination-links p-3 border-top">
        <span class="me-2">Pages:</span>
        <span class="me-1">[</span>
        <span th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:if="${currentPage != i}" th:href="@{/pets(page=${i}, name=${pet.name})}" class="me-1">[[${i}]]</a>
          <span th:unless="${currentPage != i}" class="me-1 fw-bold">[[${i}]]</span>
        </span>
        <span class="me-2">]</span>
        <a th:if="${currentPage > 1}" th:href="@{/pets(page=1, name=${pet.name})}" title="First"
          class="fa fa-fast-backward me-2"></a>
        <span th:unless="${currentPage > 1}" class="fa fa-fast-backward me-2 text-secondary"></span>
        <a th:if="${currentPage > 1}" th:href="@{/pets(page=${currentPage - 1}, name=${pet.name})}" title="Previous"
          class="fa fa-step-backward me-2"></a>
        <span th:unless="${currentPage > 1}" class="fa fa-step-backward me-2 text-secondary"></span>
        <a th:if="${currentPage < totalPages}" th:href="@{/pets(page=${currentPage + 1}, name=${pet.name})}"
          title="Next" class="fa fa-step-forward me-2"></a>
        <span th:unless="${currentPage < totalPages}" class="fa fa-step-forward me-2 text-secondary"></span>
        <a th:if="${currentPage < totalPages}" th:href="@{/pets(page=${totalPages}, name=${pet.name})}" title="Last"
          class="fa fa-fast-forward"></a>
        <span th:unless="${currentPage < totalPages}" class="fa fa-fast-forward text-secondary"></span>
      </div>

    </div>
  </div>

</body>

</html>
