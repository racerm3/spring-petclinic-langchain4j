<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'pets')}">

<body>

  <div class="page-header">
    <h1>Find Pets</h1>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${pet}" th:action="@{/pets}" method="get" id="search-pet-form">
        <div class="row mb-3">
          <label for="name" class="col-sm-2 col-form-label">Name</label>
          <div class="col-sm-10">
            <input id="name" class="form-control" th:field="*{name}" size="30" maxlength="80" placeholder="Search by pet name"/>
            <div th:if="${#fields.hasAnyErrors()}" class="text-danger small mt-1">
              <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-10 offset-sm-2">
            <button type="submit" class="btn btn-primary">Find Pet</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
