<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="page-header">
    <h1>
      <th:block th:if="${visit['new']}">New </th:block>
      Visit
    </h1>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h3 class="h6 text-secondary mb-2">Pet</h3>
      <table class="table table-sm table-striped mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Birth Date</th>
            <th>Type</th>
            <th>Owner</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td th:text="${pet.name}"></td>
            <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${pet.type}"></td>
            <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <form th:object="${visit}" method="post">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <div class="form-group has-feedback">
          <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date')}" />
          <input th:replace="~{fragments/inputField :: input ('Description', 'description', 'text')}" />
        </div>
        <div class="form-group">
          <div class="offset-sm-2 col-sm-10">
            <button class="btn btn-primary" type="submit">Add Visit</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h3 class="h6 text-secondary mb-2">Previous Visits</h3>
      <table class="table table-striped mb-0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="v : ${pet.visits}" th:if="${visit['new'] or v.id != visit.id}">
            <td th:text="${#temporals.format(v.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${v.description}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(pet.visits) or (!visit['new'] and pet.visits.size() == 1)}">
            <td colspan="2" class="text-secondary">No previous visits.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
