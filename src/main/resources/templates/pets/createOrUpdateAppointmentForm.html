<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="page-header">
    <h1>
      <th:block th:if="${appointment['new']}">New </th:block>
      <th:block th:unless="${appointment['new']}">Update </th:block>
      Appointment
    </h1>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h3 class="h6 text-secondary mb-2">Pet</h3>
      <table class="table table-sm table-striped mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Birth Date</th>
            <th>Type</th>
            <th>Owner</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td th:text="${pet.name}"></td>
            <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${pet.type}"></td>
            <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <form th:object="${appointment}" method="post" id="appointmentForm">
        <input type="hidden" name="petId" th:value="${pet.id}" />

        <div class="form-group has-feedback row mb-3">
          <label class="col-sm-2 col-form-label text-sm-right">Date</label>
          <div class="col-sm-10">
            <input type="date" class="form-control" th:field="*{appointmentDate}" onchange="reloadForm()" />
            <span class="text-danger" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></span>
          </div>
        </div>

        <div class="form-group has-feedback row mb-3">
          <label class="col-sm-2 col-form-label text-sm-right">Veterinarian</label>
          <div class="col-sm-10">
            <select class="form-select" th:field="*{vet}" onchange="reloadForm()">
              <option value="">-- Select Veterinarian --</option>
              <option th:each="v : ${vets}" th:value="${v.id}" th:text="${v.firstName + ' ' + v.lastName}"></option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('vet')}" th:errors="*{vet}"></span>
          </div>
        </div>

        <div class="form-group has-feedback row mb-3">
          <label class="col-sm-2 col-form-label text-sm-right">Time</label>
          <div class="col-sm-10">
            <select class="form-select" th:field="*{appointmentTime}">
              <option value="">-- Select Time --</option>
              <option th:each="slot : ${availableSlots}" 
                      th:value="${slot}" 
                      th:text="${#temporals.format(slot, 'HH:mm')}">
              </option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></span>
          </div>
        </div>

        <div class="form-group has-feedback mb-3">
          <input th:replace="~{fragments/inputField :: input ('Description', 'description', 'text')}" />
        </div>

        <div class="form-group">
          <div class="offset-sm-2 col-sm-10">
            <button class="btn btn-primary" type="submit">Book Appointment</button>
            <a class="btn btn-primary ms-2" th:href="@{/owners/__${owner.id}__}">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    function reloadForm() {
        var dateVal = document.getElementById('appointmentDate').value;
        var vetVal = document.getElementById('vet').value;
        var url = window.location.pathname + '?appointmentDate=' + dateVal;
        if (vetVal) {
            url += '&vetId=' + vetVal;
        }
        window.location.href = url;
    }
  </script>

</body>
</html>
