<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

  <body>

    <div th:if="${message}" class="alert alert-success" id="success-message">
      <span th:text="${message}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger" id="error-message">
      <span th:text="${error}"></span>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4 mb-3">Owner Information</h2>
        <table class="table table-borderless mb-0" th:object="${owner}">
          <tr>
            <th class="text-secondary" style="width: 8rem;">Name</th>
            <td><strong th:text="*{firstName + ' ' + lastName}"></strong></td>
          </tr>
          <tr>
            <th class="text-secondary">Address</th>
            <td th:text="*{address}"></td>
          </tr>
          <tr>
            <th class="text-secondary">City</th>
            <td th:text="*{city}"></td>
          </tr>
          <tr>
            <th class="text-secondary">Telephone</th>
            <td th:text="*{telephone}"></td>
          </tr>
        </table>
        <div class="mt-3">
          <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary me-2">Edit Owner</a>
          <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary">Add New Pet</a>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="card-title h4 mb-3">Pets and Visits</h2>
        <div th:each="pet, petStat : ${owner.pets}" th:classappend="${petStat.last} ? 'border-0 pb-0 mb-0' : 'border-bottom pb-3 mb-3'">
          <dl class="row mb-2">
            <dt class="col-sm-2 text-secondary">Name</dt>
            <dd class="col-sm-10" th:text="${pet.name}"></dd>
            <dt class="col-sm-2 text-secondary">Birth Date</dt>
            <dd class="col-sm-10" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
            <dt class="col-sm-2 text-secondary">Type</dt>
            <dd class="col-sm-10" th:text="${pet.type}"></dd>
          </dl>
          <table class="table table-sm table-striped mb-2">
            <thead>
              <tr>
                <th>Visit Date</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="visit : ${pet.visits}">
                <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
                <td th:text="${visit?.description}"></td>
              </tr>
            </tbody>
          </table>
          <div>
            <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-primary me-2">Edit Pet</a>
            <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-primary">Add Visit</a>
          </div>
        </div>
        <p th:if="${#lists.isEmpty(owner.pets)}" class="text-secondary mb-0">No pets yet.</p>
      </div>
    </div>

    <script th:inline="javascript">
      (function() {
        var successEl = document.getElementById("success-message");
        var errorEl = document.getElementById("error-message");
        if (successEl || errorEl) {
          setTimeout(function() {
            if (successEl) successEl.style.display = "none";
            if (errorEl) errorEl.style.display = "none";
          }, 3000);
        }
      })();
    </script>

  </body>

</html>
