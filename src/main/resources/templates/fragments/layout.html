<!doctype html>
<html th:fragment="layout (template, menu)">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

  <title>PetClinic :: a Spring Framework demonstration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->

  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/chat.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" role="navigation">
    <div class="container-fluid">
      <!-- <a class="navbar-brand" th:href="@{/}"><span></span></a> -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar" style>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,title,glyph,text)" th:class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa fa-home"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li th:replace="~{::menuItem ('/','home','home page','home','Home')}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span>Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners/find','owners','find owners','search','Owners')}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span>Owners</span>
          </li>

          <li th:replace="~{::menuItem ('/pets/find','pets','find pets','search','Pets')}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span>Pets</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','find veterinarians','search','Veterinarians')}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span>Veterinarians</span>
          </li>

          <li th:replace="~{::menuItem ('/appointments','appointments','view calendar','calendar','Appointments')}">
            <span class="fa fa-calendar" aria-hidden="true"></span>
            <span>Appointments</span>
          </li>

        </ul>

        <ul class="nav navbar-nav ms-auto text-nowrap">
          <li class="nav-item dropdown" th:if="${session.user != null}">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="fa fa-user" aria-hidden="true"></span>
              <span th:text="${session.user.username}">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
            </ul>
          </li>
          <li class="nav-item" th:if="${session.user == null}">
            <a class="nav-link" th:href="@{/login}">
              <span class="fa fa-sign-in" aria-hidden="true"></span>
              <span>Login</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="container xd-container app-container">

      <th:block th:insert="${template}" />

      <footer class="app-footer">
        <!-- <img src="../static/images/spring-logo.svg" th:src="@{/resources/images/spring-logo.svg}"
          alt="Spring" class="logo"> -->
      </footer>
    </div>
  </div>
  <div class="chatbox minimized" id="chatbox" th:unless="${menu == 'login'}">
    <div class="chatbox-header" onclick="toggleChatbox()">
      Chat with Us!
    </div>
    <div class="chatbox-content" id="chatbox-content" style="height: 40px;">
      <div class="chatbox-messages" id="chatbox-messages">
        <!-- Chat messages will be dynamically inserted here -->
      </div>
      <div id="chatbox-input-container">
        <textarea id="chatbox-input" rows="1" onkeydown="handleKeyDown(event)"
          placeholder="Enter your message..."></textarea>
        <button onclick="sendMessage()" class="btn btn-primary">
          <i class="fa fa-paper-plane"></i>
        </button>
        <button id="mic-button" onclick="toggleSpeechRecognition()" class="btn btn-primary">
          <i class="fa fa-microphone"></i>
        </button>
      </div>
    </div>
  </div>



  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/marked/14.1.2/marked.min.js}"></script>

  <!-- JavaScript for handling chatbox interaction -->
  <script th:src="@{/resources/js/chat.js}" th:unless="${menu == 'login'}"></script>
  <script th:unless="${menu == 'login'}">
    // Call loadChatMessages when the page loads
    window.onload = loadChatMessages;

    // Ensure messages are saved when navigating away
    window.onbeforeunload = saveChatMessages;
  </script>

</body>

</html>
