<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">

<body>

<h2>New Appointment</h2>

<form th:object="${appointment}" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Date</label>
        <div class="col-sm-10">
            <input type="date" th:field="*{appointmentDate}" class="form-control" />
            <span class="help-inline" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></span>
        </div>
    </div>
    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Time</label>
        <div class="col-sm-10">
            <select th:field="*{appointmentTime}" class="form-control">
                <option th:each="slot : ${availableSlots}" th:value="${slot}" th:text="${#temporals.format(slot, 'hh:mm a')}"></option>
            </select>
            <span class="help-inline" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></span>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Owner</label>
        <div class="col-sm-10 pos-relative">
            <input type="text" id="owner-search" class="form-control" placeholder="Type owner name..." autocomplete="off"/>
            <input type="hidden" name="ownerId" id="owner-id" />
            <div id="owner-results" class="autocomplete-results"></div>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Pet</label>
        <div class="col-sm-10">
            <select name="petId" id="pet-id" class="form-control" disabled>
                <option value="">Select an owner first...</option>
            </select>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Veterinarian</label>
        <div class="col-sm-10 pos-relative">
            <input type="text" id="vet-search" class="form-control" placeholder="Type vet name..." autocomplete="off"/>
            <input type="hidden" name="vetId" id="vet-id" />
            <div id="vet-results" class="autocomplete-results"></div>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Description</label>
        <div class="col-sm-10">
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            <span class="help-inline" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>
    </div>

    <div class="form-group row mt-4">
        <div class="col-sm-offset-2 col-sm-10 d-flex align-items-center gap-2">
            <button class="btn btn-primary" type="submit">Book Appointment</button>
            <a class="btn btn-primary" th:href="@{/appointments}">Cancel</a>
        </div>
    </div>
</form>

<style>
    .pos-relative { position: relative; }
    .autocomplete-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1000;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        display: none;
    }
    .autocomplete-item {
        padding: 8px 12px;
        cursor: pointer;
    }
    .autocomplete-item:hover {
        background-color: #f0f0f0;
    }
</style>

<script>
    function setupAutocomplete(inputId, resultsId, hiddenId, apiUrl, getExtraParams = null, onSelect = null) {
        const input = document.getElementById(inputId);
        const results = document.getElementById(resultsId);
        const hidden = document.getElementById(hiddenId);

        input.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) {
                results.style.display = 'none';
                return;
            }

            let url = `${apiUrl}?query=${encodeURIComponent(query)}`;
            if (getExtraParams) {
                const params = getExtraParams();
                for (const key in params) {
                    if (params[key]) url += `&${key}=${encodeURIComponent(params[key])}`;
                }
            }

            const response = await fetch(url);
            const data = await response.json();

            results.innerHTML = '';
            if (data.length > 0) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = item.text;
                    div.onclick = () => {
                        input.value = item.text;
                        hidden.value = item.id;
                        results.style.display = 'none';
                        if (onSelect) onSelect(item);
                    };
                    results.appendChild(div);
                });
                results.style.display = 'block';
            } else {
                results.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target !== input) {
                results.style.display = 'none';
            }
        });
    }

    setupAutocomplete('owner-search', 'owner-results', 'owner-id', '/api/search/owners', null, async (owner) => {
        const petSelect = document.getElementById('pet-id');
        petSelect.innerHTML = '<option value="">Loading pets...</option>';
        petSelect.disabled = true;

        try {
            const response = await fetch(`/api/search/owners/${owner.id}/pets`);
            const pets = await response.json();
            
            petSelect.innerHTML = '<option value="">-- Select Pet --</option>';
            if (pets.length > 0) {
                pets.forEach(pet => {
                    const option = document.createElement('option');
                    option.value = pet.id;
                    option.textContent = pet.text;
                    petSelect.appendChild(option);
                });
                petSelect.disabled = false;
            } else {
                petSelect.innerHTML = '<option value="">No pets found for this owner</option>';
            }
        } catch (error) {
            console.error('Error fetching pets:', error);
            petSelect.innerHTML = '<option value="">Error loading pets</option>';
        }
    });
    
    setupAutocomplete('vet-search', 'vet-results', 'vet-id', '/api/search/vets');
</script>

</body>
</html>
