<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">

<body>

<h2>New Appointment</h2>

<form th:object="${appointment}" id="appointment-form" class="form-horizontal" method="post" novalidate>
    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Date <span class="text-danger">*</span></label>
        <div class="col-sm-10">
            <input type="date" th:field="*{appointmentDate}" class="form-control" required />
            <span class="help-inline" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></span>
            <span class="help-inline validation-error" id="error-date" style="display:none">Date is required.</span>
        </div>
    </div>
    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Time <span class="text-danger">*</span></label>
        <div class="col-sm-10">
            <select th:field="*{appointmentTime}" class="form-control" required>
                <option value="">-- Select a time --</option>
                <option th:each="slot : ${availableSlots}" th:value="${slot}" th:text="${#temporals.format(slot, 'hh:mm a')}"></option>
            </select>
            <span class="help-inline" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></span>
            <span class="help-inline validation-error" id="error-time" style="display:none">Time is required.</span>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Owner <span class="text-danger">*</span></label>
        <div class="col-sm-10 pos-relative">
            <input type="text" id="owner-search" class="form-control" placeholder="Type owner name..." autocomplete="off"/>
            <input type="hidden" name="ownerId" id="owner-id" />
            <div id="owner-results" class="autocomplete-results"></div>
            <span class="help-inline validation-error" id="error-owner" style="display:none">Please select an owner from the list.</span>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Pet <span class="text-danger">*</span></label>
        <div class="col-sm-10">
            <select name="petId" id="pet-id" class="form-control" disabled>
                <option value="">Select an owner first...</option>
            </select>
            <span class="help-inline validation-error" id="error-pet" style="display:none">Please select a pet.</span>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Veterinarian <span class="text-danger">*</span></label>
        <div class="col-sm-10 pos-relative">
            <input type="text" id="vet-search" class="form-control" placeholder="Type vet name..." autocomplete="off"/>
            <input type="hidden" name="vetId" id="vet-id" />
            <div id="vet-results" class="autocomplete-results"></div>
            <span class="help-inline validation-error" id="error-vet" style="display:none">Please select a veterinarian from the list.</span>
        </div>
    </div>

    <div class="form-group has-feedback">
        <label class="col-sm-2 control-label">Description <span class="text-danger">*</span></label>
        <div class="col-sm-10">
            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
            <span class="help-inline" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            <span class="help-inline validation-error" id="error-description" style="display:none">Description is required.</span>
        </div>
    </div>

    <div class="form-group row mt-4">
        <div class="col-sm-offset-2 col-sm-10 d-flex align-items-center gap-2">
            <button class="btn btn-primary" type="submit" id="book-btn">Book Appointment</button>
            <a class="btn btn-primary" th:href="@{/appointments}">Cancel</a>
        </div>
    </div>
</form>

<style>
    .pos-relative { position: relative; }
    .autocomplete-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1000;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        display: none;
    }
    .autocomplete-item {
        padding: 8px 12px;
        cursor: pointer;
    }
    .autocomplete-item:hover {
        background-color: #f0f0f0;
    }
    .validation-error {
        color: #c0392b;
        font-size: 0.875em;
        margin-top: 4px;
        display: block;
    }
    .form-control.field-invalid {
        border-color: #c0392b;
        box-shadow: 0 0 0 2px rgba(192,57,43,0.15);
    }
</style>

<script>
    function setupAutocomplete(inputId, resultsId, hiddenId, apiUrl, getExtraParams = null, onSelect = null) {
        const input = document.getElementById(inputId);
        const results = document.getElementById(resultsId);
        const hidden = document.getElementById(hiddenId);

        input.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) {
                results.style.display = 'none';
                return;
            }

            let url = `${apiUrl}?query=${encodeURIComponent(query)}`;
            if (getExtraParams) {
                const params = getExtraParams();
                for (const key in params) {
                    if (params[key]) url += `&${key}=${encodeURIComponent(params[key])}`;
                }
            }

            const response = await fetch(url);
            const data = await response.json();

            results.innerHTML = '';
            if (data.length > 0) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = item.text;
                    div.onclick = () => {
                        input.value = item.text;
                        hidden.value = item.id;
                        results.style.display = 'none';
                        if (onSelect) onSelect(item);
                    };
                    results.appendChild(div);
                });
                results.style.display = 'block';
            } else {
                results.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target !== input) {
                results.style.display = 'none';
            }
        });
    }

    setupAutocomplete('owner-search', 'owner-results', 'owner-id', '/api/search/owners', null, async (owner) => {
        const petSelect = document.getElementById('pet-id');
        petSelect.innerHTML = '<option value="">Loading pets...</option>';
        petSelect.disabled = true;

        try {
            const response = await fetch(`/api/search/owners/${owner.id}/pets`);
            const pets = await response.json();
            
            petSelect.innerHTML = '<option value="">-- Select Pet --</option>';
            if (pets.length > 0) {
                pets.forEach(pet => {
                    const option = document.createElement('option');
                    option.value = pet.id;
                    option.textContent = pet.text;
                    petSelect.appendChild(option);
                });
                petSelect.disabled = false;
            } else {
                petSelect.innerHTML = '<option value="">No pets found for this owner</option>';
            }
        } catch (error) {
            console.error('Error fetching pets:', error);
            petSelect.innerHTML = '<option value="">Error loading pets</option>';
        }
    });
    
    setupAutocomplete('vet-search', 'vet-results', 'vet-id', '/api/search/vets');

    // Clear hidden value if the user manually clears/changes the text input
    document.getElementById('owner-search').addEventListener('input', () => {
        if (!document.getElementById('owner-search').value.trim()) {
            document.getElementById('owner-id').value = '';
        }
    });
    document.getElementById('vet-search').addEventListener('input', () => {
        if (!document.getElementById('vet-search').value.trim()) {
            document.getElementById('vet-id').value = '';
        }
    });

    function setFieldError(inputEl, errorEl, show) {
        if (show) {
            inputEl.classList.add('field-invalid');
            errorEl.style.display = 'block';
        } else {
            inputEl.classList.remove('field-invalid');
            errorEl.style.display = 'none';
        }
    }

    document.getElementById('appointment-form').addEventListener('submit', function (e) {
        let valid = true;

        // Date
        const dateInput = document.querySelector('input[name="appointmentDate"]');
        const dateError = document.getElementById('error-date');
        if (!dateInput || !dateInput.value.trim()) {
            setFieldError(dateInput, dateError, true);
            valid = false;
        } else {
            setFieldError(dateInput, dateError, false);
        }

        // Time
        const timeSelect = document.querySelector('select[name="appointmentTime"]');
        const timeError = document.getElementById('error-time');
        if (!timeSelect || !timeSelect.value) {
            setFieldError(timeSelect, timeError, true);
            valid = false;
        } else {
            setFieldError(timeSelect, timeError, false);
        }

        // Owner (hidden field must be populated by autocomplete selection)
        const ownerSearch = document.getElementById('owner-search');
        const ownerId = document.getElementById('owner-id');
        const ownerError = document.getElementById('error-owner');
        if (!ownerId.value) {
            setFieldError(ownerSearch, ownerError, true);
            valid = false;
        } else {
            setFieldError(ownerSearch, ownerError, false);
        }

        // Pet
        const petSelect = document.getElementById('pet-id');
        const petError = document.getElementById('error-pet');
        if (!petSelect.value) {
            setFieldError(petSelect, petError, true);
            valid = false;
        } else {
            setFieldError(petSelect, petError, false);
        }

        // Vet (hidden field must be populated by autocomplete selection)
        const vetSearch = document.getElementById('vet-search');
        const vetId = document.getElementById('vet-id');
        const vetError = document.getElementById('error-vet');
        if (!vetId.value) {
            setFieldError(vetSearch, vetError, true);
            valid = false;
        } else {
            setFieldError(vetSearch, vetError, false);
        }

        // Description
        const descTextarea = document.querySelector('textarea[name="description"]');
        const descError = document.getElementById('error-description');
        if (!descTextarea || !descTextarea.value.trim()) {
            setFieldError(descTextarea, descError, true);
            valid = false;
        } else {
            setFieldError(descTextarea, descError, false);
        }

        if (!valid) {
            e.preventDefault();
            // Scroll to the first invalid field
            const firstInvalid = document.querySelector('.field-invalid');
            if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
</script>

</body>
</html>
