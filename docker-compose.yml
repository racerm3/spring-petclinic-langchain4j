services:
  petclinic:
    image: spring-petclinic-langchain4j
    container_name: spring-petclinic-langchain4j
    build:
      context: .
      args:
        - LLM_PROFILE=${LLM_PROFILE:-gemini}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - SPRING_PROFILES_ACTIVE=${LLM_PROFILE:-gemini}
      - DATABASE=h2
